<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제품소개 | 이송글로벌</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 기존 스타일 유지 */
    .page-hero {
      position: relative;
      width: 100%;
      height: 300px;
      background: url('images/productsimg.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .page-hero h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    .page-intro {
      text-align: center;
      max-width: 800px;
      margin: 24px auto;
      color: #333;
      font-size: 1rem;
      line-height: 1.6;
    }
    .tabs {
      text-align: center;
      margin-top: 40px;
    }
    .tabs button {
      margin: 0 8px;
      padding: 8px 16px;
      border: none;
      background: #eee;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .tabs button.active {
      background: #333;
      color: #fff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin: 30px auto;
      max-width: 1200px;
      padding: 0 16px;
    }
    .product-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      text-align: left; /* 여기를 left로 변경 */
      padding: 16px;
    }
